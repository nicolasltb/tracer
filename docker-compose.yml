services:
  besu-node1:
    image: hyperledger/besu:latest
    volumes:
      - ./besu/genesis.json:/config/genesis.json:ro
      - ./besu/node1/key:/config/key:ro
      - besu_data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --node-private-key-file=/config/key
      - --rpc-http-enabled=true
      - --rpc-http-api=ETH,NET,QBFT,WEB3,MINER
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --discovery-enabled=false
      - --min-gas-price=0
      - --tx-pool-min-gas-price=0
      - --tx-pool-no-local-priority=false
      - --logging=INFO
    ports:
      - "8545:8545"
      - "30303:30303"
    healthcheck:
      # bash TCP device — works without curl/wget in the Besu image
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8545' 2>/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  deployer:
    build:
      context: ./scripts
    environment:
      BESU_RPC_URL: http://besu-node1:8545
      BESU_CHAIN_ID: ${BESU_CHAIN_ID:-1337}
      CONTRACT_SOURCE_PATH: /contracts/CoffeeTrace.sol
      ABI_OUTPUT_PATH: /output/CoffeeTrace.json
      OUTPUT_DIR: /output
    volumes:
      - ./contracts:/contracts:ro
      - contract_data:/output
    depends_on:
      besu-node1:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./tracer-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY}
      BESU_RPC_URL: http://besu-node1:8545
      BESU_CHAIN_ID: ${BESU_CHAIN_ID}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - contract_data:/contract_data:ro
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully

volumes:
  postgres_data:
  besu_data:
  contract_data:
  uploads_data:
